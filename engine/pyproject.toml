[project]
name = "videomagic-engine"
version = "0.1.0"
description = "Local AI narration and media engine for VideoMagic"
requires-python = ">=3.11"
dependencies = [
  "kokoro>=0.9.4",
  "misaki[zh]",
  "numpy>=1.26",
  "soundfile>=0.12",
  "pillow>=10",
  "json-repair>=0.63",
  "transformers[torch]>=5.7.0",
  "torchvision",
  "av",
  "accelerate>=1.0"
]

[project.scripts]
videomagic-engine = "videomagic_engine.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
