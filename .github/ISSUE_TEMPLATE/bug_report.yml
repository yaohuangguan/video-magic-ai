name: Bug report
description: Report a reproducible VideoMagic problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve VideoMagic. Please remove private media, paths, tokens, and personal data before posting logs or screenshots.
  - type: input
    id: version
    attributes:
      label: VideoMagic version
      description: The version shown in the app or GitHub Release.
      placeholder: v0.1.2
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Install / first-run setup
        - Video import / preview
        - Voice generation
        - Timeline / waveform
        - Subtitles / ducking
        - Render / export
        - Project files / history
        - Other
    validations:
      required: true
  - type: dropdown
    id: inference
    attributes:
      label: Inference mode
      options:
        - Auto
        - GPU / CUDA
        - CPU
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Import...
        3. Click...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste only non-sensitive diagnostics or relevant log excerpts.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked existing issues for the same problem.
          required: true
        - label: I removed private media, credentials, tokens, and personal information.
          required: true
