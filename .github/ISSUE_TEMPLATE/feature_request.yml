name: Feature request
description: Suggest a focused improvement to the creator workflow.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What creator problem are you trying to solve?
      placeholder: I want to...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the smallest useful workflow.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Voice / TTS
        - Timeline
        - Video / audio editing
        - Subtitles
        - Export
        - Projects / presets
        - Runtime / performance
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. What are you doing today instead?
  - type: checkboxes
    id: principles
    attributes:
      label: Product fit
      options:
        - label: This can preserve the local-first core workflow.
          required: true
        - label: This does not depend on impersonating a real person without permission.
          required: true
